[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unirep-reforge"
version = "0.2.0"
description = "Modular, permission-based software analysis and reconstruction workspace"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UNIREP contributors" }]
dependencies = []

[project.optional-dependencies]
web = ["playwright>=1.45"]
desktop = ["PySide6>=6.7"]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
unirep = "unirep.cli:main"
unirep-gui = "unirep.desktop:main"

[tool.setuptools]
py-modules = ["reforge"]

[tool.setuptools.packages.find]
include = ["unirep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
