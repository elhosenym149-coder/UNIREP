name: Android companion build

on:
  push:
    branches: ["main", "work/**"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle -p apps/android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reforge-companion-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
